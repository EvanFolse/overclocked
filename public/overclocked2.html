<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overclocked - Build a CPU</title>
<style>
  :root { --ink: #1c2b3a; --muted: #6b7f92; --mint: #1f9d73; --indigo: #4a47c8; --line: rgba(60, 90, 120, 0.16); }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); min-height: 100vh;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1100px 700px at 50% 25%, #f7fafd 0%, #dde8f3 55%, #c8d8e9 100%);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 44px 44px; opacity: 0.35;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 3px; color: var(--indigo); opacity: 0.85; }
  .muted { color: var(--muted); font-size: 13px; line-height: 1.45; }
  .hidden { display: none; }

  #app { position: relative; display: grid; grid-template-columns: 280px 1fr 440px; min-height: 100vh; }
  #left { padding: 24px 18px; display: flex; flex-direction: column; gap: 16px; }
  #center { padding: 18px 10px; display: flex; flex-direction: column; align-items: center; }
  #right { background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(14px); border-left: 1px solid rgba(255,255,255,0.9); padding: 22px 20px; height: 100vh; overflow-y: auto; position: sticky; top: 0; box-shadow: -10px 0 40px rgba(50, 80, 120, 0.12); }

  .logo { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 26px; font-weight: 800; letter-spacing: 6px; }
  .era { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 2px; color: var(--muted); margin-top: 4px; }

  .card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 14px; box-shadow: 0 8px 30px rgba(50, 80, 120, 0.12); padding: 12px; }
  .stagecard { padding: 10px 12px; border-radius: 12px; margin-top: 8px; cursor: pointer; background: rgba(255,255,255,0.75); border: 1px solid rgba(74, 71, 200, 0.15); transition: transform 0.15s, box-shadow 0.15s; }
  .stagecard:hover { transform: translateX(3px); box-shadow: 0 6px 18px rgba(74, 71, 200, 0.18); }
  .stagecard.locked { opacity: 0.45; cursor: not-allowed; }
  .stagecard.locked:hover { transform: none; box-shadow: none; }
  .stagecard.passed { border-color: rgba(31, 157, 115, 0.5); }
  .stagecard .t { font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 700; }
  .stagecard .s { font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--muted); margin-top: 3px; }

  #tutorBtn { background: #efeaff; color: var(--indigo); border: 1px solid #c9bfff; font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 700; padding: 10px 12px; border-radius: 10px; cursor: pointer; text-align: left; }
  #tutorBtn:hover { background: #e4dcff; }
  #tutor button { background: #fff; color: var(--ink); border: 1px solid #d5dde6; padding: 5px 9px; margin: 3px 3px 3px 0; border-radius: 999px; cursor: pointer; font-size: 12px; }
  #tutor button:hover { background: #eef6ff; }

  #cp { font-family: ui-monospace, Menlo, monospace; font-size: 54px; font-weight: 800; color: var(--mint); text-shadow: 0 4px 18px rgba(31, 157, 115, 0.28); margin-top: 6px; }
  #cps { font-family: ui-monospace, Menlo, monospace; color: #3b82a0; font-size: 14px; }
  #chipWrap { position: relative; width: 100%; max-width: 740px; margin-top: 4px; }
  #chipBob { animation: bob 7s ease-in-out infinite; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  #chip { width: 100%; height: auto; display: block; overflow: visible; }
  .float { position: absolute; pointer-events: none; font-family: ui-monospace, Menlo, monospace; font-weight: 800; font-size: 20px; color: var(--mint); animation: floatUp 0.95s ease-out forwards; text-shadow: 0 2px 8px #fff; }
  @keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-70px); } }

  #runBtn { margin-top: 6px; background: linear-gradient(135deg, #22b585, #1a8f6a); color: #fff; border: 0; border-radius: 999px; padding: 12px 26px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 22px rgba(31, 157, 115, 0.35); transition: transform 0.08s; }
  #runBtn:active { transform: scale(0.96); }
  #stats { display: grid; grid-template-columns: repeat(5, minmax(90px, 1fr)); gap: 10px; width: 100%; max-width: 740px; margin-top: 16px; }
  .stat { background: rgba(255,255,255,0.75); border: 1px solid #fff; border-radius: 12px; padding: 9px 11px; box-shadow: 0 6px 18px rgba(50, 80, 120, 0.1); }
  .stat .k { font-family: ui-monospace, Menlo, monospace; font-size: 9px; letter-spacing: 2px; color: var(--muted); }
  .stat .v { font-family: ui-monospace, Menlo, monospace; font-size: 17px; font-weight: 700; margin-top: 3px; }

  #tabs { display: flex; gap: 14px; margin: 10px 0 18px; border-bottom: 1px solid #dbe4ec; }
  #tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 6px 0; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 1.5px; color: var(--muted); cursor: pointer; }
  #tabs button.on { color: var(--indigo); border-bottom-color: var(--indigo); font-weight: 700; }
  h2.h { font-family: ui-monospace, Menlo, monospace; letter-spacing: 3px; font-size: 18px; margin: 6px 0; color: #24506b; }

  .part { background: #fff; border: 1px solid #dde6ee; border-radius: 12px; padding: 11px 13px; margin: 9px 0; box-shadow: 0 3px 12px rgba(50, 80, 120, 0.06); }
  .part .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .part .nm { font-weight: 700; font-size: 14px; }
  .part .lv { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); margin-left: 6px; font-weight: 400; }
  .part .nx { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: #2a86a8; margin-top: 4px; }
  .part.sel { border-color: var(--indigo); box-shadow: 0 0 0 2px rgba(74, 71, 200, 0.15); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 7px; }

  button.btn { background: linear-gradient(135deg, #5b57e0, #4a47c8); color: #fff; border: 0; border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; margin: 3px 3px 3px 0; }
  button.btn:hover { filter: brightness(1.1); }
  button.ghost { background: #fff; color: var(--ink); border: 1px solid #cdd8e3; border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  button.upg { background: #e8f1ff; color: #2a4d8f; border: 1px solid #b9d0f5; border-radius: 9px; padding: 6px 12px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  button.upg.can { background: #1f9d73; color: #fff; border-color: #1f9d73; }
  button.upg:disabled { opacity: 0.55; cursor: default; }
  button.opt { display: block; width: 100%; text-align: left; background: #fff; color: var(--ink); border: 1px solid #cdd8e3; border-radius: 10px; padding: 11px 13px; margin: 8px 0; font-size: 14px; cursor: pointer; transition: transform 0.1s, border-color 0.1s; }
  button.opt:hover:not(:disabled) { border-color: var(--indigo); transform: translateX(3px); }
  button.opt.bad { background: #ffecec; border-color: #f3a5a5; color: #9a3a3a; }
  button.opt.good { background: #e3f7ee; border-color: #7fd3b0; }
  button.opt:disabled { cursor: default; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .two button.opt { text-align: center; font-weight: 800; letter-spacing: 2px; font-size: 18px; padding: 18px; }

  .rhead { display: flex; justify-content: space-between; align-items: center; font-family: ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: 2px; color: var(--indigo); font-weight: 700; }
  .dots { display: flex; gap: 6px; margin: 12px 0; }
  .dot { height: 6px; flex: 1; border-radius: 3px; background: #dbe4ec; }
  .dot.done { background: var(--mint); }
  .dot.cur { background: var(--indigo); }
  .tag { font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; }
  .prompt { font-size: 16px; font-weight: 600; line-height: 1.4; margin: 6px 0 4px; }
  .good-msg { color: #137a57; font-weight: 700; margin-top: 10px; }
  .bad-msg { color: #b04545; font-weight: 600; margin-top: 10px; }
  .fb p { font-size: 14px; line-height: 1.5; margin: 6px 0 10px; }
  #bar { position: relative; height: 34px; background: #e1e9f1; border-radius: 8px; margin: 14px 0; overflow: hidden; }
  #zone { position: absolute; left: 40%; width: 20%; height: 100%; background: rgba(31, 157, 115, 0.45); }
  #marker { position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: var(--indigo); border-radius: 3px; }
  table.gantt { border-collapse: collapse; font-size: 12px; margin: 8px 0; font-family: ui-monospace, Menlo, monospace; }
  table.gantt td, table.gantt th { border: 1px solid #cdd8e3; width: 28px; height: 24px; text-align: center; }
  table.gantt td.on { background: #d8f3e8; color: #157a56; font-weight: 700; }
  .slotrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .slotrow button { background: #fff; border: 1px solid #cdd8e3; border-radius: 10px; padding: 12px 6px; cursor: pointer; font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  .slotrow button:hover { border-color: var(--indigo); }
  .bar { height: 8px; background: #e1e9f1; border-radius: 4px; overflow: hidden; margin: 6px 0 12px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #22b585, #4a47c8); }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1c2b3a; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; }

  /* ---------- minigames ---------- */
  .gbar { height: 8px; background: #e1e9f1; border-radius: 4px; overflow: hidden; margin: 12px 0 6px; }
  #gTime { height: 100%; width: 100%; background: linear-gradient(90deg, #22b585, #4a47c8); }
  .gstats { display: flex; justify-content: space-between; align-items: baseline; font-family: ui-monospace, Menlo, monospace; font-size: 11px; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px; }
  .gstats b { font-size: 22px; color: var(--ink); }
  #gCombo { color: #e08a00; font-weight: 800; }
  .arena { position: relative; min-height: 430px; background: linear-gradient(180deg, #ffffff, #eef4fa); border: 1px solid #dbe4ec; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 12px; overflow: hidden; user-select: none; }
  .arena.shake { animation: shake 0.3s; }
  @keyframes shake { 25% { transform: translateX(-7px); } 75% { transform: translateX(7px); } }
  .overlay { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 22px; z-index: 6; }
  .bigicon { font-size: 56px; }
  .otitle { font-family: ui-monospace, Menlo, monospace; font-weight: 800; letter-spacing: 3px; font-size: 20px; }
  .orule { font-size: 15px; line-height: 1.45; max-width: 320px; }
  .ostars { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
  .stars { font-size: 38px; letter-spacing: 6px; }
  .gain { font-family: ui-monospace, Menlo, monospace; font-size: 26px; font-weight: 800; color: var(--mint); }
  .inst { background: #e3f7ee; color: #137a57; font-weight: 700; padding: 6px 12px; border-radius: 10px; font-size: 14px; }
  button.bigbtn { background: linear-gradient(135deg, #22b585, #1a8f6a); color: #fff; border: 0; border-radius: 999px; padding: 13px 30px; font-size: 17px; font-weight: 800; cursor: pointer; box-shadow: 0 8px 20px rgba(31, 157, 115, 0.35); }
  button.bigbtn:active { transform: scale(0.96); }
  .gtoast { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); padding: 5px 13px; border-radius: 999px; font-weight: 700; font-size: 13px; background: #1c2b3a; color: #fff; z-index: 4; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
  .gtoast.good { background: #1f9d73; }
  .gtoast.bad { background: #d24b4b; }
  .gpop { position: absolute; font-family: ui-monospace, Menlo, monospace; font-weight: 800; color: #1f9d73; font-size: 24px; pointer-events: none; animation: floatUp 0.8s ease-out forwards; z-index: 3; text-shadow: 0 2px 6px #fff; }
  .glabel { font-family: ui-monospace, Menlo, monospace; font-size: 10px; letter-spacing: 2px; color: var(--muted); align-self: flex-start; margin-top: 4px; }

  /* dispatcher */
  .dcard { height: 96px; width: 100%; display: flex; align-items: center; justify-content: center; margin-top: 22px; }
  .dpop { font-family: ui-monospace, Menlo, monospace; font-size: 28px; font-weight: 800; background: #fff; border: 2px solid #7c5cff; border-radius: 14px; padding: 18px 22px; box-shadow: 0 8px 22px rgba(124, 92, 255, 0.25); animation: popin 0.18s ease-out; }
  @keyframes popin { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .pbar { width: 100%; height: 8px; background: #e1e9f1; border-radius: 4px; overflow: hidden; }
  .pfill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff8a3d, #e04848); }
  .dest { display: grid; grid-template-columns: 1fr; gap: 10px; width: 100%; margin-top: 6px; }
  .destbtn { background: #fff; border: 2px solid #cdd8e3; border-radius: 12px; padding: 14px; cursor: pointer; font-size: 16px; text-align: left; transition: transform 0.08s, border-color 0.1s; }
  .destbtn small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .destbtn:hover { border-color: var(--indigo); transform: translateX(3px); }
  .destbtn:active { transform: scale(0.98); }

  /* ALU bits */
  .opbadge { font-family: ui-monospace, Menlo, monospace; font-size: 30px; font-weight: 800; color: #fff; background: linear-gradient(135deg, #ff6b6b, #e04848); padding: 6px 26px; border-radius: 12px; margin-top: 6px; }
  .ophint { color: var(--muted); font-size: 13px; margin-top: -6px; }
  .bitrow { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .bitrow .rl { width: 22px; font-family: ui-monospace, Menlo, monospace; font-weight: 800; color: var(--indigo); }
  .bitrow .rn { width: 52px; font-family: ui-monospace, Menlo, monospace; color: var(--muted); text-align: left; }
  .lamp { width: 52px; height: 52px; border-radius: 50%; border: 2px solid #b7c4d1; background: #eef2f6; font-family: ui-monospace, Menlo, monospace; font-weight: 800; font-size: 20px; color: #9aa9b8; cursor: pointer; transition: transform 0.08s; padding: 0; margin: 0; }
  .lamp.on { background: radial-gradient(circle at 35% 30%, #fff7b0, #ffc83d); color: #7a5200; border-color: #e0a800; box-shadow: 0 0 18px rgba(255, 200, 60, 0.75); }
  .lamp.static { cursor: default; }
  .lamp:not(.static):active { transform: scale(0.9); }
  .lamp.wrongbit { border-color: #e04848; box-shadow: 0 0 0 3px rgba(224, 72, 72, 0.5); }
  .bitline { width: 80%; height: 3px; background: #cdd8e3; border-radius: 2px; }
  .weights { display: flex; gap: 10px; justify-content: center; font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); margin-left: 0; }
  .weights span { width: 52px; text-align: center; }

  /* registers */
  .queue { display: flex; gap: 8px; width: 100%; }
  .qcard { flex: 1; background: #fff; border: 2px solid #cdd8e3; border-radius: 10px; padding: 8px 6px; text-align: center; font-family: ui-monospace, Menlo, monospace; font-size: 13px; font-weight: 700; position: relative; }
  .qcard.now { border-color: var(--indigo); background: #f1f0ff; }
  .qcard small { display: block; font-size: 9px; letter-spacing: 2px; color: var(--indigo); }
  .qbar { height: 5px; background: #dcd9ff; border-radius: 3px; margin-top: 6px; overflow: hidden; }
  .qfill { height: 100%; width: 100%; background: var(--indigo); }
  .vchip { display: inline-block; min-width: 26px; padding: 3px 7px; border-radius: 7px; color: #fff; font-weight: 800; font-family: ui-monospace, Menlo, monospace; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
  .regrow, .ramrow { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; }
  .rslot { flex: 1; min-width: 70px; background: #eaf3ff; border: 2px dashed #8fb4e6; border-radius: 12px; padding: 12px 4px; cursor: pointer; font-size: 18px; }
  .rslot small { display: block; font-size: 10px; letter-spacing: 1px; color: var(--muted); margin-bottom: 4px; }
  .rslot.full { border-style: solid; background: #fff; }
  .vcard { background: #fff; border: 2px solid #cdd8e3; border-radius: 10px; padding: 8px 12px; cursor: pointer; font-size: 18px; }
  .vcard.sel { border-color: #111; transform: translateY(-4px); box-shadow: 0 6px 14px rgba(0,0,0,0.2); }
  .vcard.dim { opacity: 0.4; }

  /* clock rhythm */
  .track { position: relative; width: 100%; height: 100px; background: #e8eef5; border-radius: 14px; overflow: hidden; margin-top: 18px; }
  .zone { position: absolute; top: 18px; width: 48px; height: 64px; border-radius: 50%; border: 4px solid #1f9d73; background: rgba(31, 157, 115, 0.15); }
  .note { position: absolute; top: 32px; width: 36px; height: 36px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffe08a, #ffb020); box-shadow: 0 3px 10px rgba(255, 176, 32, 0.6); }
  .partsrow { display: flex; gap: 8px; }
  .pchip { padding: 8px 12px; border-radius: 8px; background: #dfe7f0; font-family: ui-monospace, Menlo, monospace; font-weight: 700; font-size: 12px; color: #6b7f92; transition: background 0.1s; }
  .pchip.lit { background: #ffb020; color: #fff; transform: scale(1.12); }

  /* pipeline */
  .pipe { display: flex; gap: 6px; width: 100%; margin-top: 14px; }
  .pcell { flex: 1; background: #fff; border: 2px solid #cdd8e3; border-radius: 10px; text-align: center; padding: 6px 2px; }
  .pcell small { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  .pslot { height: 48px; display: flex; align-items: center; justify-content: center; }
  .blk { display: inline-block; padding: 8px 6px; border-radius: 8px; color: #fff; font-family: ui-monospace, Menlo, monospace; font-weight: 800; font-size: 13px; animation: popin 0.15s ease-out; }
  .blk.haz { outline: 3px solid #e04848; animation: hazard 0.5s infinite alternate; }
  @keyframes hazard { to { transform: scale(1.18); } }
  .pinfo { min-height: 40px; text-align: center; font-size: 14px; }
  .fixrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .fixbtn { background: #fff; border: 2px solid #cdd8e3; border-radius: 12px; padding: 14px 6px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .fixbtn small { display: block; font-weight: 400; color: var(--muted); }
  .fixbtn:hover { border-color: var(--indigo); }

  /* decoder */
  .legend { font-family: ui-monospace, Menlo, monospace; font-size: 12px; background: #f3f0ff; border-radius: 10px; padding: 8px 12px; line-height: 1.7; width: 100%; }
  .dbody { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; margin-top: 6px; }
  .tiles { display: flex; gap: 6px; }
  .bit { width: 44px; height: 54px; border-radius: 10px; border: 2px solid #cdd8e3; background: #fff; font-family: ui-monospace, Menlo, monospace; font-size: 22px; font-weight: 800; padding: 0; margin: 0; }
  .bit.g0 { border-color: #7c5cff; color: #7c5cff; }
  .bit.g1 { border-color: #3aa0ff; color: #3aa0ff; }
  .bit.g2 { border-color: #22b585; color: #22b585; }
  .bit.gap { margin-right: 12px; }
  .bit.on { background: #fff6cf; }
  .cyc { display: flex; gap: 8px; }
  .cycbtn { background: #fff; border: 2px solid #cdd8e3; border-radius: 10px; padding: 12px 16px; font-family: ui-monospace, Menlo, monospace; font-size: 17px; font-weight: 800; cursor: pointer; margin: 0; }
  .want { font-family: ui-monospace, Menlo, monospace; font-size: 26px; font-weight: 800; }

  /* cache */
  .asked { font-size: 18px; margin-top: 10px; }
  .asked b { font-family: ui-monospace, Menlo, monospace; font-size: 40px; color: var(--indigo); }
  .cslots { display: flex; gap: 10px; width: 100%; }
  .cslot { flex: 1; background: #fff; border: 2px solid #cdd8e3; border-radius: 12px; padding: 12px 6px; cursor: pointer; font-size: 26px; font-weight: 800; font-family: ui-monospace, Menlo, monospace; margin: 0; }
  .cslot small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
  .cslot.pick { border-color: #e04848; animation: hazard 0.4s infinite alternate; }
  .agebar { height: 8px; background: #e1e9f1; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
  .agebar > div { height: 100%; }
  .cmsg { min-height: 24px; font-size: 15px; }

  /* sorter */

<script>
// =====================================================
// DATA: the parts of the CPU
// slot = [column, row, width, depth] on an 8 x 8 grid
// =====================================================
var PARTS = [
  { key: "cu", name: "Control Unit (CU)", short: "CU", color: "#7c5cff", stage: 1, cost: 120, cps: 2, slot: [2, 0, 3, 1],
    desc: "The director of the processor.",
    levels: ["Hardwired control", "Microcoded control", "Pipelined control paths", "Out-of-order control", "Speculative control"],
    what: "Reads each instruction and sends signals telling the other parts what to do and when.",

  { key: "alu", name: "Arithmetic Logic Unit (ALU)", short: "ALU", color: "#ff6b6b", stage: 1, cost: 180, cps: 3, slot: [2, 1, 3, 2],

  { key: "clock", name: "Clock", short: "CLK", color: "#ffb020", stage: 2, cost: 150, cps: 3, slot: [0, 0, 2, 1],
    desc: "Sets the beat that keeps every part in step.",
    levels: ["5 MHz clock", "33 MHz clock", "200 MHz clock", "1.5 GHz clock", "4.5 GHz boost clock"],

    analogy: "Like the drummer in a rowing boat. Everyone pulls their oar on the beat." },
  { key: "pipe", name: "Pipeline", short: "PIPE", color: "#ff8a3d", stage: 2, cost: 600, cps: 8, slot: [0, 3, 8, 1],
    desc: "Overlaps instructions so no part sits idle.",
    levels: ["2-stage pipeline", "5-stage pipeline", "Superscalar (2 per tick)", "Deep pipeline (14 stages)", "Wide superscalar (4+ per tick)"],

  { key: "decoder", name: "Instruction Decoder", short: "DEC", color: "#14b8a6", stage: 3, cost: 900, cps: 10, slot: [5, 0, 3, 1],
    desc: "Turns instruction bits into control signals.",
    levels: ["Fixed instruction set", "Richer instruction set", "Variable-length decode", "Micro-op translation", "Wide decode (4+ per tick)"],
    what: "Takes the binary instruction and works out which operation and which registers it means.",
    analogy: "Like a translator who turns a sentence in machine language into steps the other parts can follow." },
  { key: "l1", name: "L1 Cache", short: "L1", color: "#22c55e", stage: 4, cost: 1500, cps: 16, slot: [0, 4, 4, 2],
    desc: "Smallest, fastest memory next to the core.",
    levels: ["1 KB cache", "4 KB cache", "16 KB split cache", "32 KB, 8-way cache", "64 KB, low-latency cache"],
    what: "Keeps recently used data right beside the CPU so it does not wait for slow RAM.",
    analogy: "Like keeping your textbook open on your desk instead of walking to the library every time." },
  { key: "l2", name: "L2 Cache", short: "L2", color: "#84cc16", stage: 4, cost: 2800, cps: 26, slot: [0, 6, 8, 2],
    desc: "Bigger, slightly slower backup cache.",
    levels: ["16 KB L2", "64 KB L2", "256 KB L2", "1 MB L2", "4 MB L2"],
    what: "A larger cache that catches what L1 misses, so there are fewer trips all the way to RAM.",
    analogy: "Like the bookshelf in your room. Bigger than your desk, but still much closer than the library." },
  { key: "fpu", name: "Floating-Point Unit (FPU)", short: "FPU", color: "#ec4899", stage: 5, cost: 5000, cps: 40, slot: [5, 1, 3, 2],
    desc: "Fast math on decimal numbers.",
    levels: ["Software floating point", "Basic FPU", "Pipelined FPU", "SIMD vector FPU", "Wide vector FPU"],
    what: "Handles numbers with decimal points (like 3.14159) that whole-number hardware is slow at. FLOPS counts how many of these a CPU does per second.",
    analogy: "Like a calculator that has a decimal key. The plain ALU is the one that only knows whole numbers." },
  { key: "cores", name: "Multi-core", short: "CORES", color: "#06b6d4", stage: 5, cost: 9000, cps: 70, slot: [4, 4, 4, 2],
    desc: "More cores means more work at once.",
    levels: ["Single core", "Dual core", "Quad core", "8 cores", "16 cores"],
    what: "Several complete CPU cores on one chip, each running its own instructions at the same time.",
    analogy: "Like opening more checkout lanes at a store. More customers get served at once, as long as there are enough customers." }
];

var PART = {};
for (var pi = 0; pi < PARTS.length; pi++) {
  PART[PARTS[pi].key] = PARTS[pi];
}

var TAGS = ["STAGE 1 · BASIC CPU", "STAGE 2 · THE CPU IN MOTION", "STAGE 3 · SPEAKING CPU", "STAGE 4 · MEMORY HIERARCHY", "STAGE 5 · BEYOND THE CPU"];

// =====================================================
// DATA: the 5 stages (each stage = parts you build by beating minigames)
// =====================================================
var STAGES = [
  { name: "KNOW CPU", blurb: "Meet the three core parts. Beat each minigame to build them.", parts: ["cu", "alu", "regs"] },
  { name: "The CPU in Motion", blurb: "Make the chip tick and keep instructions flowing.", parts: ["clock", "pipe"] },
  { name: "Speaking CPU", blurb: "Instructions are just bits. Learn to read and write them.", parts: ["decoder"] },
  { name: "The Memory Hierarchy", blurb: "Keep the right data in the right place.", parts: ["l1", "l2"] },
  { name: "Beyond the CPU", blurb: "Decimals and teamwork: FPUs and multiple cores.", parts: ["fpu", "cores"] }
];

// =====================================================
// GAME STATE
// =====================================================
var game = newGame();
var tab = "upgrades";
var learnOpen = "";
var selected = "";
var hot = "";
var G = null;      // the minigame being played (or null)
var view = null;   // the stage hub being shown (or null)
var shownCp = 0;
var animOn = false;
var lastAfford = "";
var resetArmed = false;

function newGame() {
  var g = { cp: 0, earned: 0, answers: 0, right: 0, reduce: false, sound: true, stars: {}, parts: {}, stages: ["open", "locked", "locked", "locked", "locked"] };
  for (var i = 0; i < PARTS.length; i++) {
    g.parts[PARTS[i].key] = { on: false, level: 1, h: 0 };
  }
  return g;
}

function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr) { arr.sort(function () { return Math.random() - 0.5; }); return arr; }
function fmt(n) { return Math.floor(n).toLocaleString(); }
function el(id) { return document.getElementById(id); }

function heightOf(level) { return 10 + level * 5; }
function upCost(key) { return Math.floor(PART[key].cost * Math.pow(1.9, game.parts[key].level - 1)); }

function lvl(key) { return game.parts[key].on ? game.parts[key].level : 0; }
function totalCps() {
  var t = 0;
  for (var i = 0; i < PARTS.length; i++) {
    var p = game.parts[PARTS[i].key];
    if (p.on) { t += PARTS[i].cps * p.level; }
  }
  return t;
}
function totalLevels() {
  var t = 0;
  for (var i = 0; i < PARTS.length; i++) {
    var p = game.parts[PARTS[i].key];
    if (p.on) { t += p.level; }
  }
  return t;
}
function clickPower() { return 1 + totalLevels(); }
function gainCp(n) { game.cp += n; game.earned += n; }

// stats shown under the chip
function bitsNow() { return lvl("alu") > 0 ? [4, 8, 16, 32, 64][lvl("alu") - 1] : 0; }
function clockMHz() { return lvl("clock") > 0 ? [5, 33, 200, 1500, 4500][lvl("clock") - 1] : 0; }
function coresNow() { return lvl("cores") > 0 ? [1, 2, 4, 8, 16][lvl("cores") - 1] : 1; }
function flopsNow() { return lvl("fpu") > 0 ? [0.5, 5, 50, 500, 5000][lvl("fpu") - 1] * coresNow() : 0; }
function instrNow() {
  var n = lvl("alu") > 0 ? [4, 16, 48, 120, 300][lvl("alu") - 1] : 0;
  if (lvl("decoder") > 0) { n += [10, 30, 80, 160, 300][lvl("decoder") - 1]; }
  return n;
}

// =====================================================
// 3D (isometric) CHIP DRAWING
// =====================================================
var OX = 360, OY = 95, K = 0.8;

function iso(x, y, z) {
  return [OX + (x - y) * 0.866 * K, OY + (x + y) * 0.5 * K - z * K];
}

function pts(list) {
  var s = "";
  for (var i = 0; i < list.length; i++) {
    var p = iso(list[i][0], list[i][1], list[i][2]);
    s += p[0].toFixed(1) + "," + p[1].toFixed(1) + " ";
  }
  return s;
}

function poly(list, fill, extra) {
  return '<polygon points="' + pts(list) + '" fill="' + fill + '" ' + (extra || "") + '/>';
}

function line3(a, b, cls, extra) {
  var p = iso(a[0], a[1], a[2]);
  var q = iso(b[0], b[1], b[2]);
  return '<line class="' + cls + '" x1="' + p[0].toFixed(1) + '" y1="' + p[1].toFixed(1) + '" x2="' + q[0].toFixed(1) + '" y2="' + q[1].toFixed(1) + '" ' + (extra || "") + '/>';
}

// a box has a left face, a right face and a top face
function box(x, y, w, d, z0, h, top, left, right, extra) {
  var z1 = z0 + h;
  var s = "";
  s += poly([[x, y + d, z1], [x + w, y + d, z1], [x + w, y + d, z0], [x, y + d, z0]], left, extra);
  s += poly([[x + w, y, z1], [x + w, y + d, z1], [x + w, y + d, z0], [x + w, y, z0]], right, extra);
  s += poly([[x, y, z1], [x + w, y, z1], [x + w, y + d, z1], [x, y + d, z1]], top, extra);
  return s;
}

// lighten (amt > 0) or darken (amt < 0) a hex color
function shade(hex, amt) {
  var n = parseInt(hex.slice(1), 16);
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  function f(v) {
    if (amt > 0) { return Math.round(v + (255 - v) * amt); }
    return Math.round(v * (1 + amt));
  }
  return "rgb(" + f(r) + "," + f(g) + "," + f(b) + ")";
}

// is box a behind box b (so it should be drawn first)?
function behind(a, b) {
  return (a.x + a.w <= b.x) || (a.y + a.d <= b.y);
}

function sortBoxes(list) {
  var out = [];
  var rest = list.slice();
  while (rest.length > 0) {
    var pick = 0;
    for (var i = 0; i < rest.length; i++) {
      var blocked = false;
      for (var j = 0; j < rest.length; j++) {
        if (i != j && behind(rest[j], rest[i]) && !behind(rest[i], rest[j])) { blocked = true; break; }
      }
      if (!blocked) { pick = i; break; }
    }
    out.push(rest[pick]);
    rest.splice(pick, 1);
  }
  return out;
}

function drawChip() {
  var s = "<defs>";
  s += '<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>';
  for (var i = 0; i < PARTS.length; i++) {
    var c = PARTS[i].color;
    s += '<linearGradient id="g_' + PARTS[i].key + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + shade(c, 0.5) + '"/><stop offset="1" stop-color="' + c + '"/></linearGradient>';
  }
  s += '<linearGradient id="gpcb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9bdcb4"/><stop offset="1" stop-color="#6cc08f"/></linearGradient>';
  s += '<linearGradient id="gslab" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5f7fa"/><stop offset="1" stop-color="#d9dfe7"/></linearGradient>';
  s += '<linearGradient id="gdie" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#33409a"/><stop offset="1" stop-color="#1c2468"/></linearGradient>';
  s += "</defs>";

  // soft shadow on the "table"
  s += poly([[-10, -10, -6], [480, -10, -6], [480, 480, -6], [-10, 480, -6]], "rgba(40, 70, 110, 0.32)", 'filter="url(#soft)"');

  var pinStroke = 'stroke="#b88a1f" stroke-width="0.6"';
  var n, y0, x0;

  // back pins (drawn before the board so the board covers their ends)
  for (n = 0; n < 12; n++) {
    y0 = 14 + n * 36;
    s += poly([[-58, y0, 3], [-38, y0, 3], [-38, y0 + 12, 3], [-58, y0 + 12, 3]], "#e9bd4f", pinStroke);
    x0 = 14 + n * 36;
    s += poly([[x0, -58, 3], [x0 + 12, -58, 3], [x0 + 12, -38, 3], [x0, -38, 3]], "#e9bd4f", pinStroke);
  }

  // circuit board
  s += box(-40, -40, 480, 480, 0, 8, "url(#gpcb)", "#4fa574", "#3f8f62", 'stroke="rgba(255,255,255,0.35)" stroke-width="0.8" stroke-linejoin="round"');

  // copper traces on the board
  for (n = 0; n < 12; n++) {
    y0 = 20 + n * 36;
    s += line3([-36, y0, 8], [-20, y0, 8], "", 'stroke="#5fb583" stroke-width="1.8"');
    s += line3([420, y0, 8], [436, y0, 8], "", 'stroke="#5fb583" stroke-width="1.8"');
    x0 = 20 + n * 36;
    s += line3([x0, -36, 8], [x0, -20, 8], "", 'stroke="#5fb583" stroke-width="1.8"');
    s += line3([x0, 420, 8], [x0, 436, 8], "", 'stroke="#5fb583" stroke-width="1.8"');
  }

  // front pins
  for (n = 0; n < 12; n++) {
    y0 = 14 + n * 36;
    s += poly([[438, y0, 3], [458, y0, 3], [458, y0 + 12, 3], [438, y0 + 12, 3]], "#f3cd63", pinStroke);
    x0 = 14 + n * 36;
    s += poly([[x0, 438, 3], [x0 + 12, 438, 3], [x0 + 12, 458, 3], [x0, 458, 3]], "#f3cd63", pinStroke);
  }

  // package slab and silicon die
  s += box(-20, -20, 440, 440, 8, 6, "url(#gslab)", "#c6cdd7", "#aeb7c3", 'stroke="rgba(255,255,255,0.5)" stroke-width="0.8"');
  s += box(0, 0, 400, 400, 14, 4, "url(#gdie)", "#161c52", "#10153f", 'stroke="rgba(150,170,255,0.4)" stroke-width="0.8"');

  // faint grid on the die
  for (n = 1; n < 8; n++) {
    s += line3([n * 50, 0, 18], [n * 50, 400, 18], "", 'stroke="rgba(255,255,255,0.07)" stroke-width="1"');
    s += line3([0, n * 50, 18], [400, n * 50, 18], "", 'stroke="rgba(255,255,255,0.07)" stroke-width="1"');
  }

  // wires between parts
  var wires = [["clock", "cu"], ["cu", "regs"], ["cu", "alu"], ["cu", "decoder"], ["alu", "fpu"], ["regs", "pipe"], ["alu", "pipe"], ["pipe", "l1"], ["pipe", "cores"], ["l1", "l2"], ["cores", "l2"]];
  for (i = 0; i < wires.length; i++) {
    var a = PART[wires[i][0]];
    var b = PART[wires[i][1]];
    var ax = (a.slot[0] + a.slot[2] / 2) * 50, ay = (a.slot[1] + a.slot[3] / 2) * 50;
    var bx = (b.slot[0] + b.slot[2] / 2) * 50, by = (b.slot[1] + b.slot[3] / 2) * 50;
    var live = (game.parts[a.key].on && game.parts[b.key].on) ? " live" : "";
    s += line3([ax, ay, 18], [bx, by, 18], "trace" + live);
  }

  // empty slots (locked parts) as dashed outlines
  for (i = 0; i < PARTS.length; i++) {
    var P = PARTS[i];
    if (game.parts[P.key].on) { continue; }
    var sx = P.slot[0] * 50 + 3, sy = P.slot[1] * 50 + 3, sw = P.slot[2] * 50 - 6, sd = P.slot[3] * 50 - 6;
    var tip = P.name + " (unlocks in Stage " + P.stage + ")";
    s += '<g class="slotg" onclick="clickSlot(\'' + P.key + '\')"><title>' + tip + '</title>';
    s += poly([[sx, sy, 18], [sx + sw, sy, 18], [sx + sw, sy + sd, 18], [sx, sy + sd, 18]], "rgba(255,255,255,0.05)", 'stroke="rgba(255,255,255,0.35)" stroke-width="1.2" stroke-dasharray="5 4"');
    var cc = iso(sx + sw / 2, sy + sd / 2, 18);
    s += '<text x="' + cc[0].toFixed(1) + '" y="' + (cc[1] + 4).toFixed(1) + '" text-anchor="middle" font-size="11" fill="rgba(255,255,255,0.5)" font-family="ui-monospace,Menlo,monospace">' + P.short + '</text>';
    s += "</g>";
  }

  // installed parts as 3D boxes, back to front
  var list = [];
  for (i = 0; i < PARTS.length; i++) {
    var Q = PARTS[i];
    if (game.parts[Q.key].on) {
      list.push({ key: Q.key, x: Q.slot[0] * 50 + 3, y: Q.slot[1] * 50 + 3, w: Q.slot[2] * 50 - 6, d: Q.slot[3] * 50 - 6, h: game.parts[Q.key].h });
    }
  }
  list = sortBoxes(list);
  for (i = 0; i < list.length; i++) {
    var B = list[i];
    var info = PART[B.key];
    var col = info.color;
    var isSel = (selected == B.key);
    var stroke = isSel ? 'stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"' : 'stroke="rgba(255,255,255,0.45)" stroke-width="0.8" stroke-linejoin="round"';
    var cls = "partg" + (hot == B.key ? " hot" : "");
    s += '<g class="' + cls + '" onclick="clickPart(\'' + B.key + '\')"><title>' + info.name + '</title>';
    s += box(B.x, B.y, B.w, B.d, 18, B.h, "url(#g_" + B.key + ")", shade(col, -0.25), shade(col, -0.42), stroke);
    var top = iso(B.x + B.w / 2, B.y + B.d / 2, 18 + B.h);
    var lab = 'font-family="ui-monospace,Menlo,monospace" text-anchor="middle" fill="#fff" stroke="rgba(0,0,0,0.35)" stroke-width="2.4" paint-order="stroke" font-weight="800"';
    s += '<text x="' + top[0].toFixed(1) + '" y="' + (top[1] + 2).toFixed(1) + '" font-size="13" ' + lab + '>' + info.short + '</text>';
    s += '<text x="' + top[0].toFixed(1) + '" y="' + (top[1] + 14).toFixed(1) + '" font-size="9" ' + lab + '>Lv ' + game.parts[B.key].level + '</text>';
    s += "</g>";
  }

  el("chip").innerHTML = s;
}

// parts grow taller when upgraded, and rise when installed
function kickAnim() {
  if (!animOn) {
    animOn = true;
    requestAnimationFrame(animStep);
  }
}

function animStep() {
  var moving = false;
  for (var i = 0; i < PARTS.length; i++) {
    var p = game.parts[PARTS[i].key];
    if (!p.on) { continue; }
    var target = heightOf(p.level);
    var d = target - p.h;
    if (game.reduce || Math.abs(d) <= 0.4) {
      p.h = target;
    } else {
      p.h += d * 0.14;
      moving = true;
    }
  }
  drawChip();
  if (moving) {
    requestAnimationFrame(animStep);
  } else {
    animOn = false;
  }
}

function setHot(key) {
  hot = key;
  drawChip();
  setTimeout(function () {
    if (hot == key) { hot = ""; drawChip(); }
  }, 2600);
}

function installPart(key) {
  var p = game.parts[key];
  if (p.on) { return; }
  p.on = true;
  p.level = 1;
  p.h = 0;
  kickAnim();
  renderLeft();
  renderStats();
  renderHud();
}

// =====================================================
// MINIGAME ENGINE
// Every part has a minigame. The engine gives each one an intro screen,
// a timer, a score, a combo meter, sound, stars and a results screen.
// =====================================================
var GAMES = {};
var audioCtx = null;

// a quick beep for hits and misses
function beep(freq, ms) {
  if (!game.sound) { return; }
  try {
    if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    var o = audioCtx.createOscillator();
    var vol = audioCtx.createGain();
    o.type = "triangle";
    o.frequency.value = freq;
    vol.gain.value = 0.05;
    o.connect(vol);
    vol.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + ms / 1000);
  } catch (e) {}
}

// make an element, put it inside a parent, and return it
function mk(parent, tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) { e.className = cls; }
  if (html !== undefined) { e.innerHTML = html; }
  parent.appendChild(e);
  return e;
}

function starsText(key) {
  var n = game.stars[key] || 0;
  var s = "";
  for (var i = 0; i < 3; i++) { s += (i < n) ? "★" : "☆"; }
  return s;
}

function stopGameTimers(g) {
  if (!g) { return; }
  for (var i = 0; i < g.ids.length; i++) {
    clearInterval(g.ids[i]);
    clearTimeout(g.ids[i]);
  }
  g.ids = [];
  g.running = false;
}

function toggleSound() {
  game.sound = !game.sound;
  renderRight();
}

// ---------- stage hub (list of the minigames in a stage) ----------
function openHub(i) {
  if (game.stages[i] == "locked") { toast("Build every part in the previous stage to unlock this one."); return; }
  if (G) { stopGameTimers(G); G = null; }
  view = { type: "hub", stage: i };
  renderRight();
}

function closeHub() {
  view = null;
  renderRight();
}

function renderHub() {
  var i = view.stage;
  var st = STAGES[i];
  var h = "<div class='rhead'><span>STAGE " + (i + 1) + " · " + st.name.toUpperCase() + "</span><button class='ghost' onclick='closeHub()'>✕</button></div>";
  h += "<p class='muted' style='margin-top:14px'>" + st.blurb + "</p>";
  for (var j = 0; j < st.parts.length; j++) {
    var key = st.parts[j];
    var P = PART[key];
    var on = game.parts[key].on;
    h += "<div class='part'><div class='top'><div><span class='swatch' style='background:" + P.color + "'></span><span class='nm'>" + GAMES[key].icon + " " + GAMES[key].title + "</span></div><span class='mono'>" + starsText(key) + "</span></div>";
    h += "<div class='muted'>" + (on ? P.name + " is built. Play to earn CP!" : "Earn ★ to build the " + P.name + ".") + "</div>";
    h += "<button class='btn' onclick=\"openGame('" + key + "','hub')\">▶ " + (on ? "Play" : "Play to build") + "</button></div>";
  }
  el("rbody").innerHTML = h;
}

// ---------- starting a game ----------
function openGame(key, back) {
  if (G) { stopGameTimers(G); }
  var def = GAMES[key];
  G = { key: key, def: def, back: back, score: 0, combo: 0, best: 0, left: def.time, running: false, ended: false, ids: [], onKey: null };
  makeApi(G);
  el("tabs").style.display = "none";
  var h = "<div class='rhead'><span>" + def.icon + " " + def.title + "</span><button class='ghost' onclick='quitGame()'>✕ Quit</button></div>";
  h += "<div class='gbar'><div id='gTime'></div></div>";
  h += "<div class='gstats'><span>SCORE <b id='gScore'>0</b></span><span id='gCombo'></span><span id='gInfo'></span></div>";
  h += "<div id='arena' class='arena'></div>";
  el("rbody").innerHTML = h;
  G.arena = el("arena");
  showIntro();
}

function quitGame() {
  if (G) {
    stopGameTimers(G);
    if (G.back == "upgrades") { view = null; tab = "upgrades"; }
  }
  G = null;
  renderRight();
}

function showIntro() {
  var g = G;
  var def = g.def;
  var P = PART[g.key];
  var ov = mk(g.arena, "div", "overlay", "");
  var line = game.parts[g.key].on ? "Earn CP and stars!" : "Earn ★ to build the <b>" + P.name + "</b>!";
  ov.innerHTML = "<div class='bigicon'>" + def.icon + "</div><div class='otitle'>" + def.title + "</div><div class='orule'>" + def.rule + "</div>" +
    "<div class='ostars'>★ " + def.stars[0] + " &nbsp; ★★ " + def.stars[1] + " &nbsp; ★★★ " + def.stars[2] + "</div><div>" + line + "</div>";
  var pb = mk(ov, "button", "bigbtn", "▶ PLAY");
  pb.onclick = beginPlay;
}

function beginPlay() {
  var g = G;
  g.arena.innerHTML = "";
  g.score = 0;
  g.combo = 0;
  g.best = 0;
  g.left = g.def.time;
  g.running = true;
  g.ended = false;
  hudUpdate(g);
  if (g.def.time > 0) {
    g.every(100, function () {
      g.left -= 0.1;
      g.setBar(g.left / g.def.time);
      if (g.left <= 0) { endGame(); }
    });
  } else {
    g.setBar(0);
  }
  g.def.start(g, g.arena);
}

function hudUpdate(g) {
  if (!el("gScore")) { return; }
  el("gScore").innerHTML = g.score;
  var t = "";
  if (g.combo >= 2) { t = "🔥 COMBO " + g.combo + (g.mult() > 1 ? " · x" + g.mult() : ""); }
  el("gCombo").innerHTML = t;
}

// functions every minigame can use
function makeApi(g) {
  // repeat something while the game runs
  g.every = function (ms, fn) {
    var id = setInterval(function () { if (G === g && g.running) { fn(); } }, ms);
    g.ids.push(id);
    return id;
  };
  // do something once, later
  g.after = function (ms, fn) {
    var id = setTimeout(function () { if (G === g && g.running) { fn(); } }, ms);
    g.ids.push(id);
    return id;
  };
  // combo multiplier: x1, x1.5, x2 ... up to x3
  g.mult = function () { return 1 + Math.min(4, Math.floor(g.combo / 4)) * 0.5; };
  g.pop = function (text) {
    if (!g.arena) { return; }
    var p = mk(g.arena, "div", "gpop", text);
    p.style.left = (35 + Math.random() * 30) + "%";
    p.style.top = (38 + Math.random() * 16) + "%";
    setTimeout(function () { if (p.parentNode) { p.parentNode.removeChild(p); } }, 800);
  };
  g.say = function (html, cls) {
    if (!g.arena) { return; }
    var old = g.arena.querySelector(".gtoast");
    if (old) { old.parentNode.removeChild(old); }
    var t = mk(g.arena, "div", "gtoast " + (cls || ""), html);
    setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 1100);
  };
  // a good move
  g.good = function (points, msg) {
    g.combo++;
    if (g.combo > g.best) { g.best = g.combo; }
    var pts = Math.round(points * g.mult());
    g.score += pts;
    g.pop("+" + pts);
    beep(520 + Math.min(g.combo, 12) * 35, 90);
    if (msg) { g.say(msg, "good"); }
    hudUpdate(g);
  };
  // a mistake: combo resets and the screen shakes
  g.bad = function (msg) {
    g.combo = 0;
    beep(170, 150);
    g.arena.classList.add("shake");
    setTimeout(function () { g.arena.classList.remove("shake"); }, 300);
    if (msg) { g.say(msg, "bad"); }
    hudUpdate(g);
  };
  g.setBar = function (f) {
    var bar = el("gTime");
    if (bar) { bar.style.width = Math.max(0, Math.min(1, f)) * 100 + "%"; }
  };
  g.info = function (text) {
    if (el("gInfo")) { el("gInfo").innerHTML = text; }
  };
  g.finish = function () { endGame(); };
}

// keyboard shortcuts for the running game
document.addEventListener("keydown", function (e) {
  if (G && G.running && G.onKey) {
    if (G.onKey(e.key)) { e.preventDefault(); }
  }
});

// ---------- when a game ends ----------
function endGame() {
  var g = G;
  if (!g || g.ended) { return; }
  g.ended = true;
  stopGameTimers(g);
  g.setBar(0);

  var stars = 0;
  for (var i = 0; i < 3; i++) {
    if (g.score >= g.def.stars[i]) { stars = i + 1; }
  }
  var key = g.key;
  var P = PART[key];
  var wasOn = game.parts[key].on;
  var level = wasOn ? game.parts[key].level : 1;
  var pay = Math.round(P.cost * 0.3 * stars * (1 + 0.15 * (level - 1)));
  if (game.stars[key] === undefined || stars > game.stars[key]) { game.stars[key] = stars; }
  gainCp(pay);

  var installed = false;
  if (stars >= 1 && !wasOn) {
    installPart(key);
    setHot(key);
    installed = true;
  }
  var stageMsg = checkStages();
  renderHud();

  var starTxt = "";

// a stage is complete when every part in it is built
function checkStages() {
  var msg = "";
  for (var i = 0; i < STAGES.length; i++) {
    if (game.stages[i] != "open") { continue; }
    var all = true;
    for (var j = 0; j < STAGES[i].parts.length; j++) {
      if (!game.parts[STAGES[i].parts[j]].on) { all = false; }
    }
    if (all) {
      game.stages[i] = "passed";
      if (i + 1 < STAGES.length && game.stages[i + 1] == "locked") { game.stages[i + 1] = "open"; }
      var bonus = (i + 1) * 150;
      gainCp(bonus);
      msg += "Stage " + (i + 1) + " complete! +" + bonus + " CP. ";
    }
  }
  renderLeft();
  return msg;
}

    mk(arena, "div", "glabel", "L1 CACHE (3 slots) · bar = how recently used");
    var slotsEl = mk(arena, "div", "cslots", "");
    var msg = mk(arena, "div", "cmsg", "");

    function ageColor(age) {
      var t = Math.min(1, age / 5);
      return "hsl(" + Math.round(130 - 130 * t) + ",70%,48%)";
    }
    function render() {
      slotsEl.innerHTML = "";
      for (var i = 0; i < slots.length; i++) { makeSlot(i); }
    }
    function makeSlot(i) {
      var s = slots[i];
      var b = mk(slotsEl, "button", "cslot" + (waiting ? " pick" : ""),
        s.a + "<div class='agebar'><div style='width:" + Math.max(12, 100 - s.age * 16) + "%;background:" + ageColor(s.age) + "'></div></div><small>" + (i + 1) + " · age " + s.age + "</small>");
      b.onclick = function () { evict(i, false); };
    }
    function ask() {
      count++;
      if (count % 7 == 0) {
        var others = all.filter(function (x) { return hot.indexOf(x) == -1; });
        hot[rand(0, 2)] = others[rand(0, others.length - 1)];
      }
      req = (Math.random() < 0.72) ? hot[rand(0, 2)] : all[rand(0, all.length - 1)];
      asked.innerHTML = "CPU wants: <b>" + req + "</b>";
      var idx = -1;
      for (var i = 0; i < slots.length; i++) { if (slots[i].a == req) { idx = i; } }
      if (idx != -1) {
        g.good(10, "HIT ⚡ no wait!");
        for (var k = 0; k < slots.length; k++) { slots[k].age++; }
        slots[idx].age = 0;
        msg.innerHTML = "";
        render();
        g.after(Math.max(900, 1900 - count * 25), ask);
      } else {
        waiting = true;
        missAt = Date.now();
        msg.innerHTML = "<b style='color:#d24b4b'>MISS!</b> Evict the oldest slot!";
        render();
      }
    }
    function evict(i, forced) {
      if (!waiting) { return; }
      var oldest = 0;
      for (var k = 0; k < slots.length; k++) { if (slots[k].age > oldest) { oldest = slots[k].age; } }
      if (forced) {
        g.bad("Too slow!");
      } else if (slots[i].age >= oldest) {
        g.good(10, "LRU! Great choice");
      } else {
        g.bad("That one was used recently!");
      }
      for (var j = 0; j < slots.length; j++) { slots[j].age++; }
      slots[i] = { a: req, age: 0 };
      waiting = false;
      msg.innerHTML = "";
      render();
      g.after(900, ask);
    }
    g.every(100, function () {
      if (waiting && Date.now() - missAt > 3000) { evict(rand(0, 2), true); }
    });
    g.onKey = function (k) {
      if (k == "1" || k == "2" || k == "3") { evict(Number(k) - 1, false); return true; }
      return false;
    };
    render();
    g.after(600, ask);
  }
};

// =====================================================
// 8. L2 CACHE: MEMORY SORTER
// =====================================================
GAMES.l2 = {
  icon: "🗄️", title: "MEMORY SORTER", time: 35, stars: [70, 150, 240],
  rule: "Hot data (🔥) goes in tiny, fast memory. Cold data (❄️) goes in huge, slow storage.<br>Keys 1 to 5.",
  takeaway: "Memory is a hierarchy: the more often you need data, the closer and faster the place you keep it.",
  start: function (g, arena) {
    var places = [["REG", "tiny · fastest"], ["L1", "small · fast"], ["L2", "medium"], ["RAM", "big · slow"], ["SSD", "huge · slowest"]];
    var items = [
      ["loop counter", 0], ["running total", 0], ["array index", 0],
      ["current function", 1], ["hot array", 1], ["stack top", 1],
      ["recent photos", 2], ["open document", 2], ["game level", 2],
      ["browser tabs", 3], ["music player", 3], ["chat app", 3],
      ["old videos", 4], ["backup files", 4], ["installer file", 4]
    ];
    var patience = 3.4, cur = null, born = 0;

    var card = mk(arena, "div", "", "");
    var bar = mk(arena, "div", "pbar", "");
    var fill = mk(bar, "div", "pfill", "");
    var list = mk(arena, "div", "places", "");
    for (var i = 0; i < 5; i++) { makePlace(i); }

    function makePlace(n) {
      var b = mk(list, "button", "place", "<span>" + (n + 1) + " · " + places[n][0] + "</span><small>" + places[n][1] + "</small>");
      b.onclick = function () { pick(n); };
    }
    function flames(level) {
      if (level == 4) { return "❄️"; }
      var s = "";
      for (var i = 0; i < 4 - level; i++) { s += "🔥"; }
      return s;
    }
    function next() {
      cur = items[rand(0, items.length - 1)];
      card.innerHTML = "<div class='sortcard'>" + cur[0] + "<small>" + flames(cur[1]) + "</small></div>";
      born = Date.now();
    }
    function pick(n) {
      if (cur == null) { return; }
      if (n == cur[1]) {
        g.good(10);
        patience = Math.max(1.8, patience - 0.07);
      } else {
        g.bad(cur[0] + " belongs in " + places[cur[1]][0]);
      }
      next();
    }
    g.every(50, function () {
      var t = (Date.now() - born) / 1000;
      fill.style.width = Math.max(0, 100 - t / patience * 100) + "%";
      if (t >= patience) {
        g.bad("Too slow!");
        next();
      }
    });
    g.onKey = function (k) {
      if (k >= "1" && k <= "5") { pick(Number(k) - 1); return true; }
      return false;
    };
    next();
  }
};

// =====================================================
// 9. FPU: FLOAT THE POINT
// =====================================================
GAMES.fpu = {
  icon: "🎯", title: "FLOAT THE POINT", time: 40, stars: [48, 110, 180],
  rule: "The exponent tells the decimal point how far to FLOAT. Tap the gap where the point belongs!",
  takeaway: "Floating-point numbers store digits plus an exponent. The exponent says how far the decimal point floats.",
  start: function (g, arena) {
    var big = mk(arena, "div", "sci", "");
    mk(arena, "div", "glabel", "TAP THE GAP FOR THE DECIMAL POINT");
    var tiles = mk(arena, "div", "digits", "");
    var solved = 0, answer = 0, digits = "";

    function zeros(n) {
      var s = "";
      for (var i = 0; i < n; i++) { s += "0"; }
      return s;
    }
    function newPuzzle() {
      var d1 = rand(1, 9);
      var d2 = rand(0, 9);
      var lim = (solved < 3) ? 3 : 4;
      var e = rand(-lim, lim);
      if (solved < 2 && e == 0) { e = 2; }
      var mant = d1 + "" + d2;
      if (e >= 1) {
        digits = mant + zeros(e - 1);
        answer = digits.length;
      } else if (e == 0) {
        digits = mant;
        answer = 1;
      } else {
        digits = zeros(-e) + mant;
        answer = 1;
      }
      big.innerHTML = d1 + "." + d2 + " × 10<sup>" + e + "</sup>";
      draw();
    }
    function draw() {
      tiles.innerHTML = "";
      for (var i = 0; i <= digits.length; i++) {
        makeGap(i);
        if (i < digits.length) { mk(tiles, "span", "dig", digits.charAt(i)); }
      }
    }
    function makeGap(i) {
      var b = mk(tiles, "button", "gapbtn", "·");
      b.onclick = function () { pick(i); };
    }
    function pick(i) {
      if (i == answer) {
        var out = digits.slice(0, answer) + (answer < digits.length ? "." + digits.slice(answer) : "");
        g.good(12, "= " + out);
        solved++;
        newPuzzle();
      } else {
        g.bad("Positive exponent floats the point RIGHT, negative floats it LEFT");
      }
    }
    newPuzzle();
  }
};

// =====================================================
// 10. MULTI-CORE: CORE SCHEDULER
// =====================================================
GAMES.cores = {
  icon: "🧩", title: "CORE SCHEDULER", time: 35, stars: [80, 160, 240],
  rule: "Tap a core to give it the next task. Keep every core busy!<br>🔒 tasks need ALL cores idle first.",
  takeaway: "More cores do more work at once, but only if there are independent tasks to hand out. Serial work can't be split.",
  start: function (g, arena) {
    var cores = [];
    var queue = [];
    var serialUntil = 0;
    for (var i = 0; i < 4; i++) { cores.push({ until: 0, serial: false }); }

    mk(arena, "div", "glabel", "TASK QUEUE (next task is outlined)");
    var qEl = mk(arena, "div", "cq", "");
    mk(arena, "div", "glabel", "CORES: tap one to dispatch");
    var lanesEl = mk(arena, "div", "lanes", "");
    var laneBtns = [];
    var fills = [];
    var texts = [];
    for (var n = 0; n < 4; n++) { makeLane(n); }

    function makeLane(n) {
      var b = mk(lanesEl, "button", "lane idle", "<span class='cn'>CORE " + (n + 1) + "</span> <span class='lt'>idle 💤</span>");
      var bar = mk(b, "div", "lbar", "");
      fills.push(mk(bar, "div", "lfill", ""));
      texts.push(b.querySelector(".lt"));
      laneBtns.push(b);
      b.onclick = function () { dispatch(n); };
    }
    function makeTask() {
      return { len: rand(2, 4), serial: Math.random() < 0.18 };
    }
    function renderQueue() {
      qEl.innerHTML = "";
      for (var i = 0; i < queue.length; i++) {
        var t = queue[i];
        mk(qEl, "div", "task" + (t.serial ? " serial" : "") + (i == 0 ? " first" : ""), (t.serial ? "🔒 " : "") + t.len + "s");
      }
    }
    function dispatch(n) {
      var now = Date.now();
      if (queue.length == 0) { g.say("No tasks waiting", ""); return; }
      if (now < serialUntil) { g.bad("🔒 A serial task is running!"); return; }
      if (cores[n].until > now) { g.bad("That core is busy!"); return; }
      var t = queue[0];
      if (t.serial) {
        for (var k = 0; k < 4; k++) {
          if (cores[k].until > now) { g.bad("🔒 Needs ALL cores idle!"); return; }
        }
        serialUntil = now + t.len * 1000;
      }
      queue.shift();
      cores[n].until = now + t.len * 1000;
      cores[n].len = t.len;
      cores[n].serial = t.serial;
      renderQueue();
      beep(500, 50);
    }
    queue.push(makeTask());
    queue.push(makeTask());
    renderQueue();
    g.every(1100, function () {
      if (queue.length >= 6) {
        queue.shift();
        g.bad("Queue full, a task was dropped!");
      }
      queue.push(makeTask());
      renderQueue();
    });
    g.every(80, function () {
      var now = Date.now();
      for (var k = 0; k < 4; k++) {
        var c = cores[k];
        if (c.until > 0 && now >= c.until) {
          g.good(c.serial ? 15 : 10);
          c.until = 0;
        }
        if (c.until > 0) {
          fills[k].style.width = (100 - (c.until - now) / (c.len * 1000) * 100) + "%";
          texts[k].innerHTML = c.serial ? "🔒 serial task" : "working ⚙️";
          laneBtns[k].className = "lane";
        } else {
          fills[k].style.width = "0%";
          texts[k].innerHTML = "idle 💤";
          laneBtns[k].className = "lane idle";
        }
      }
    });
  }
};

// =====================================================
// SAVE / LOAD / START UP
// =====================================================
function save() {
  try { localStorage.setItem("overclockedSave", JSON.stringify(game)); } catch (e) {}
}

function load() {
  try {
    var s = localStorage.getItem("overclockedSave");
    if (!s) { return; }
    var g = JSON.parse(s);
    var base = newGame();
    base.cp = g.cp || 0;
    base.earned = g.earned || 0;
    base.answers = g.answers || 0;
    base.right = g.right || 0;
    base.reduce = !!g.reduce;
    base.sound = (g.sound !== false);
    base.stars = g.stars || {};
    if (g.stages && g.stages.length == 5) { base.stages = g.stages; }
    for (var i = 0; i < PARTS.length; i++) {
      var k = PARTS[i].key;
      if (g.parts && g.parts[k]) {
        base.parts[k].on = !!g.parts[k].on;
        base.parts[k].level = g.parts[k].level || 1;
        base.parts[k].h = base.parts[k].on ? heightOf(base.parts[k].level) : 0;
      }
    }
    game = base;
  } catch (e) {}
}

function renderAll() {
  renderLeft();
  renderStats();
  renderHud();
  renderRight();
  drawChip();
}

// income: runs 10 times per second
setInterval(function () {
  gainCp(totalCps() / 10);
}, 100);

// the big CP number glides toward the real value
setInterval(function () {
  var diff = game.cp - shownCp;
  if (Math.abs(diff) < 1) { shownCp = game.cp; } else { shownCp += diff * 0.25; }
  el("cp").innerHTML = fmt(shownCp) + " CP";
  // refresh the upgrade list only when a button becomes affordable (or not)
  if (!G && !view && tab == "upgrades") {
    var key = "";
    for (var i = 0; i < PARTS.length; i++) {
      var p = game.parts[PARTS[i].key];
      if (p.on && p.level < 5 && game.cp >= upCost(PARTS[i].key)) { key += PARTS[i].key + ","; }
    }
    if (key != lastAfford) {
      lastAfford = key;
      renderRight();
    }
  }
}, 60);

setInterval(save, 5000);

load();
shownCp = game.cp;
applyMotion();
renderAll();
