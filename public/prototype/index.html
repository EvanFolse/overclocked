<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overclocked - CPU Builder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <aside id="left">
    <div>
      <div class="logo">OVERCLOCKED</div>
      <div class="era" id="era">BARE SILICON</div>
    </div>
    <div class="card">
      <div class="label">STAGES</div>
      <div id="stageList"></div>
    </div>
    <button id="tutorBtn" onclick="toggleTutor()">💬 TUTOR · ask about a part</button>
    <div id="tutor" class="card hidden"></div>
  </aside>

  <main id="center">
    <div class="label">COMPUTE POINTS</div>
    <div id="cp">0 CP</div>
    <div id="cps">+0.0 CP/sec</div>
    <div id="chipWrap">
      <div id="chipBob"><svg id="chip" viewBox="0 30 720 460"></svg></div>
      <div id="floats"></div>
    </div>
    <div class="label" id="build">BUILD LEVEL 0</div>
    <button id="runBtn" onclick="runInstruction()">⚡ Execute instruction <span id="clickVal">+1</span></button>
    <div id="stats"></div>
  </main>

  <section id="right">
    <div class="label">MENU</div>
    <div id="tabs">
      <button id="tab_upgrades" onclick="setTab('upgrades')">UPGRADES</button>
      <button id="tab_learning" onclick="setTab('learning')">LEARNING</button>
      <button id="tab_progress" onclick="setTab('progress')">PROGRESS</button>
      <button id="tab_settings" onclick="setTab('settings')">SETTINGS</button>
    </div>
    <div id="rbody"></div>
  </section>

</div>
<div id="toast"></div>

<script src="js/content.js"></script>
<script src="js/core.js"></script>
<script src="js/chip.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/games/cu.js"></script>
<script src="js/games/alu.js"></script>
<script src="js/games/regs.js"></script>
<script src="js/games/clock.js"></script>
<script src="js/games/pipe.js"></script>
<script src="js/games/decoder.js"></script>
<script src="js/games/l1.js"></script>
<script src="js/games/l2.js"></script>
<script src="js/games/fpu.js"></script>
<script src="js/games/cores.js"></script>
<script src="js/main.js"></script>
</body>
</html>
